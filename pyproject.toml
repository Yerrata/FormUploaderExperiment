[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yeratta-form-c"
version = "0.1.0"
description = "Local-first guest capture and Form C filing worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "jinja2>=3.1,<4",
  "playwright==1.56.0",
  "pydantic>=2.13,<3",
  "python-multipart>=0.0.22,<1",
  "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
]

[project.scripts]
formc-app = "formc_app.cli:main"
formc-worker = "formc_app.worker:main"

[tool.setuptools.packages.find]
include = ["formc_app*"]

[tool.setuptools.package-data]
formc_app = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
